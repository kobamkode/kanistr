[package]
name = "kanistr"
version = "0.2.2"
edition = "2021"
license = "MIT"

[dependencies]
chrono = "0.4"
gpui = "0.2.2"
nom-exif = "3.8"

[profile.release]
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
little_exif = "0.6.23"
